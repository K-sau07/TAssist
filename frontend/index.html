<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAssist — grounded answers over your own documents</title>
    <meta name="description" content="Ask questions about your own documents and get answers with citations back to the exact source. Never invented." />

    <!-- Open Graph: what LinkedIn, Slack, WhatsApp and iMessage render when the
         link is pasted. og:image must be an absolute URL or it is ignored. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TAssist" />
    <meta property="og:title" content="TAssist — RAG that proves where every answer came from" />
    <meta property="og:description" content="Ask questions about your own documents and get answers with citations back to the exact lecture and slide. Java 21, Spring Boot, Spring AI, pgvector." />
    <meta property="og:url" content="https://t-assist.vercel.app" />
    <meta property="og:image" content="https://t-assist.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TAssist — RAG that proves where every answer came from" />
    <meta name="twitter:description" content="Answers with citations back to the exact source, never invented." />
    <meta name="twitter:image" content="https://t-assist.vercel.app/og.png" />
    <script>
      // Set theme before render to avoid a flash of the wrong theme.
      try {
        if (localStorage.getItem('tassist.theme') === 'dark')
          document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
