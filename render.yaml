# Render Blueprint — New → Blueprint → point at this repo.
# Free tier: sleeps after ~15 min idle, cold start ~50s. Note that the upload
# directory is ephemeral on free instances, so documents do not survive a restart.
services:
  - type: web
    name: tassist-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Neon. Use the DIRECT endpoint (host WITHOUT -pooler) — the pooled one
      # drops the SET search_path that pins this service to its schema.
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Upstash rediss:// URL.
      - key: REDIS_URL
        sync: false
      - key: TASSIST_JWT_SECRET
        generateValue: true
      # Billed per request. Chat answers fail without it; the rest of the app works.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Billed per request. Document ingestion cannot embed without it.
      - key: VOYAGE_API_KEY
        sync: false
      # The deployed frontend origin.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
