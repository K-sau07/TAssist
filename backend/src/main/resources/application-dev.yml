logging:
  level:
    root: INFO
    com.tassist: DEBUG
    org.springframework.web: INFO

# CORS in dev allows the Vite frontend (spec §18.1).
tassist:
  cors:
    allowed-origins: http://localhost:5173
  frontend-url: ${TASSIST_FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${TASSIST_JWT_SECRET:change_me_min_32_bytes_change_me_min_32_bytes}
    ttl-hours: ${TASSIST_JWT_TTL_HOURS:24}
  storage:
    dir: ${TASSIST_STORAGE_DIR:./storage}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
  embedding:
    voyage:
      api-key: ${VOYAGE_API_KEY:}
      model: ${VOYAGE_MODEL:voyage-3.5}
      dimension: ${VOYAGE_DIMENSION:1024}
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${TASSIST_CHAT_MODEL:claude-haiku-4-5}
      max-tokens: ${TASSIST_CHAT_MAX_TOKENS:1024}
